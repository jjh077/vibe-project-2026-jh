<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>그루밍데이</title>
    <meta
      name="description"
      content="그루밍데이 - 반려동물과 함께하는 따뜻한 일상"
    />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <link rel="stylesheet" href="css/notice-bar.css" />
    <link rel="stylesheet" href="css/shop.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/Swiper/8.4.5/swiper-bundle.min.css"
      integrity="sha512-okkLcBJE+U19Dpd0QdHA1wn4YY6rW3CwaxeLJT3Jmj9ZcNSbln/VYw8UdqXRIwLX7J8PmtHs0I/FPAhozFvXKg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>

  <body>
    <div class="notice-bar" id="notice-bar" hidden></div>

    <main>
      <section
        class="outer-box outer-box--bleed hero"
        aria-label="메인 배너"
        tabindex="0"
      >
        <div class="inner-box hero__inner">
          <div class="hero-track" aria-live="off">
            <article class="hero-slide" aria-label="1 / 4" aria-hidden="false">
              <picture>
                <source
                  media="(max-width: 768px)"
                  srcset="images/used/dayand-mob-3.jpg"
                />
                <img
                  class="hero-slide__image"
                  src="images/used/dayand-dt-65.jpg"
                  alt="단풍잎을 바라보는 두 마리 고양이"
                  fetchpriority="high"
                  draggable="false"
                />
              </picture>
            </article>
            <article
              class="hero-slide"
              aria-label="2 / 4"
              aria-hidden="true"
              inert
            >
              <picture>
                <source
                  media="(max-width: 768px)"
                  srcset="images/used/dayand-mob-51.jpg"
                />
                <img
                  class="hero-slide__image"
                  src="images/used/dayand-dt-32.jpg"
                  alt="단풍잎을 바라보는 고양이"
                  draggable="false"
                />
              </picture>
            </article>
            <article
              class="hero-slide"
              aria-label="3 / 4"
              aria-hidden="true"
              inert
            >
              <picture>
                <source
                  media="(max-width: 768px)"
                  srcset="images/used/dayand-mob-41.jpg"
                />
                <img
                  class="hero-slide__image"
                  src="images/used/dayand-dt-31.jpg"
                  alt="단풍잎 사이로 보이는 고양이 앞발"
                  draggable="false"
                />
              </picture>
            </article>
            <article
              class="hero-slide"
              aria-label="4 / 4"
              aria-hidden="true"
              inert
            >
              <picture>
                <source
                  media="(max-width: 768px)"
                  srcset="images/used/dayand-mob-26.jpg"
                />
                <img
                  class="hero-slide__image"
                  src="images/used/dayand-dt-28.jpg"
                  alt="고양이 그래픽 티셔츠를 입은 사람과 고양이"
                  draggable="false"
                />
              </picture>
            </article>
          </div>

          <button
            class="hero-arrow hero-arrow--previous"
            type="button"
            aria-label="이전 배너"
          >
            <span aria-hidden="true"></span>
          </button>
          <button
            class="hero-arrow hero-arrow--next"
            type="button"
            aria-label="다음 배너"
          >
            <span aria-hidden="true"></span>
          </button>

          <div class="hero-controls">
            <div class="hero-pagination" aria-label="배너 선택">
              <button
                class="hero-pagination__item"
                type="button"
                aria-label="1번 배너"
                aria-pressed="true"
              ></button>
              <button
                class="hero-pagination__item"
                type="button"
                aria-label="2번 배너"
                aria-pressed="false"
              ></button>
              <button
                class="hero-pagination__item"
                type="button"
                aria-label="3번 배너"
                aria-pressed="false"
              ></button>
              <button
                class="hero-pagination__item"
                type="button"
                aria-label="4번 배너"
                aria-pressed="false"
              ></button>
            </div>
          </div>
        </div>
      </section>

      <section
        class="best-products"
        id="best-products"
        aria-labelledby="best-products-title"
      >
        <div class="inner-box best-products__inner">
          <h1 class="best-products__title" id="best-products-title">
            베스트 상품
          </h1>
          <p class="best-products__description">가장 사랑받은 아이템들</p>
          <ul
            class="best-products__grid"
            id="best-products-grid"
            aria-label="베스트 상품"
          ></ul>
          <div
            class="best-products__extra"
            id="best-products-extra"
            aria-label="베스트 상품 더보기"
          >
            <div class="best-products__extra-inner">
              <ul
                class="best-products__grid"
                id="best-products-extra-grid"
                aria-label="베스트 상품 더보기 목록"
              ></ul>
            </div>
          </div>
          <p
            class="best-products__status"
            id="best-products-status"
            aria-live="polite"
          ></p>
          <div class="best-products__more">
            <button
              class="more-button"
              id="more-products-btn"
              type="button"
              aria-expanded="false"
            >
              <span class="more-button__label">더보기</span>
              <span class="more-button__arrow" aria-hidden="true">⌄</span>
            </button>
          </div>
        </div>
      </section>

      <section
        class="photo-review"
        id="photo-review"
        aria-labelledby="photo-review-title"
      >
        <div class="photo-review__inner">
          <header class="photo-review__heading">
            <h2 class="photo-review__title" id="photo-review-title">
              PHOTO REVIEW
            </h2>
            <p class="photo-review__description">
              소중한 구매후기 감사드립니다
            </p>
          </header>
          <div
            class="review-slider"
            role="region"
            aria-label="포토 리뷰 슬라이더"
          >
            <button
              class="review-slider__arrow review-slider__arrow--previous"
              type="button"
              aria-label="이전 리뷰"
              disabled
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m15 4-8 8 8 8"></path>
              </svg>
            </button>
            <div
              class="review-slider__viewport"
              id="photo-review-viewport"
              tabindex="0"
              aria-label="포토 리뷰 목록, 좌우 방향키로 이동"
            >
              <ul class="review-slider__track"></ul>
            </div>
            <button
              class="review-slider__arrow review-slider__arrow--next"
              type="button"
              aria-label="다음 리뷰"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m9 4 8 8-8 8"></path>
              </svg>
            </button>
            <nav
              class="review-slider__pagination"
              aria-label="리뷰 페이지"
            ></nav>
          </div>
        </div>
      </section>

      <section
        class="movie-feature"
        id="movie-feature"
        aria-label="코비, 베리 영상과 앨범"
      >
        <div class="movie-feature__inner">
          <div class="movie-feature__layout">
            <div class="movie-feature__video"></div>
            <ul class="movie-feature__list"></ul>
          </div>
          <p
            class="movie-feature__status"
            id="movie-feature-status"
            aria-live="polite"
          ></p>
        </div>
      </section>

      <section
        class="video-story"
        id="video-story"
        aria-labelledby="video-story-title"
      >
        <div class="video-story__inner">
          <h2 class="video-story__title" id="video-story-title">
            새로운 코비,베리의 이야기
          </h2>
          <div class="video-story__layout">
            <div
              class="swiper video-story__carousel"
              aria-label="코비와 베리의 영상 목록"
            >
              <div class="swiper-wrapper" id="video-story-track"></div>
              <div
                class="swiper-pagination video-story__pagination"
                aria-label="이야기 페이지"
              ></div>
            </div>
          </div>
          <p
            class="video-story__status"
            id="video-story-status"
            aria-live="polite"
          ></p>
        </div>
      </section>

      <section
        class="shorts-section"
        id="youtube-shorts"
        aria-labelledby="shorts-title"
      >
        <div class="shorts__inner">
          <header class="shorts__heading">
            <h2 class="shorts__title" id="shorts-title">Youtube Shorts</h2>
            <p class="shorts__description" id="shorts-description"></p>
          </header>
          <div
            class="shorts-viewport"
            id="shorts-viewport"
            tabindex="0"
            aria-label="유튜브 쇼츠 목록, 좌우 방향키로 이동"
          >
            <ul class="shorts-track" id="shorts-track" aria-live="polite"></ul>
          </div>
          <p class="shorts__status" id="shorts-status" aria-live="polite"></p>
          <nav
            class="shorts-pagination"
            id="shorts-pagination"
            aria-label="쇼츠 선택"
          ></nav>
        </div>
      </section>
    </main>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/Swiper/8.4.5/swiper-bundle.min.js"
      integrity="sha512-wdUM0BxMyMC/Yem1RWDiIiXA6ssXMoxypihVEwxDc+ftznGeRu4s9Fmxl8PthpxOh5CQ0eqjqw1Q8ScgNA1moQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script type="module" src="js/movie-feature.js"></script>
    <script type="module" src="js/video-story.js"></script>
    <script type="module" src="js/best-products.js"></script>
    <script type="module" src="js/footer.js"></script>
    <script type="module" src="js/main.js"></script>
    <script type="module" src="js/auth/auth-ui.js"></script>
    <script type="module" src="js/notice-bar.js"></script>
    <script type="module" src="js/photo-review.js"></script>
  </body>
</html>
