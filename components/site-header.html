<header class="outer-box outer-box--header">
      <div class="inner-box header__inner">
        <div class="part-box header__desktop">
          <nav class="part-box header__desktop-menu" aria-label="주요 메뉴">
            <a href="{{home}}#best-products">APPAREL</a>
            <a href="{{home}}#best-products">굿즈</a>
            <span class="header__menu-label">커뮤니티</span>
            <a href="{{notice}}">공지사항</a>
          </nav>

          <a class="brand-logo" href="{{home}}" aria-label="그루밍데이 홈"
            >그루밍데이</a
          >

          <nav
            class="part-box header__desktop-utilities"
            aria-label="사용자 메뉴"
          >
            <button
              class="icon-button header-search-btn"
              type="button"
              aria-label="검색"
              aria-haspopup="dialog"
              aria-expanded="false"
              aria-controls="search-drawer"
            >
              <img src="{{base}}images/used/icon_search_b.svg" alt="" />
            </button>
            <button class="icon-button" type="button" aria-label="마이페이지">
              <img src="{{base}}images/used/icon_header_mypage_b_512.svg" alt="" />
            </button>
            <div
              class="site-auth"
              data-auth-ui
              data-login-url="{{login}}"
            ></div>
            <button
              class="icon-button cart-button"
              type="button"
              aria-label="장바구니, 0개"
            >
              <img src="{{base}}images/used/icon_header_cart_b_512.svg" alt="" />
              <span class="cart-count" aria-hidden="true" hidden>0</span>
              <span class="point-badge">+1,000P</span>
            </button>
            <button class="icon-button" type="button" aria-label="언어 선택">
              <img src="{{base}}images/used/icon_header_global_b_512.svg" alt="" />
            </button>
          </nav>
        </div>

        <div class="header__mobile">
          <div class="part-box header__mobile-top">
            <div class="part-box header__mobile-leading">
              <button
                class="icon-button menu-toggle"
                type="button"
                aria-label="메뉴 열기"
                aria-expanded="false"
                aria-controls="mobile-menu"
              >
                <svg
                  class="menu-toggle__icon"
                  viewBox="0 0 24 24"
                  aria-hidden="true"
                >
                  <path
                    class="menu-toggle__line menu-toggle__line--top"
                    d="M2 4h20"
                  ></path>
                  <path
                    class="menu-toggle__line menu-toggle__line--middle"
                    d="M2 12h20"
                  ></path>
                  <path
                    class="menu-toggle__line menu-toggle__line--bottom"
                    d="M2 20h20"
                  ></path>
                </svg>
              </button>
              <button class="icon-button" type="button" aria-label="마이페이지">
                <img src="{{base}}images/used/icon_header_mypage_b_512.svg" alt="" />
              </button>
            </div>
            <a class="brand-logo" href="{{home}}" aria-label="그루밍데이 홈"
              >그루밍데이</a
            >
            <nav
              class="part-box header__mobile-utilities"
              aria-label="사용자 메뉴"
            >
              <button
                class="icon-button header-search-btn"
                type="button"
                aria-label="검색"
                aria-haspopup="dialog"
                aria-expanded="false"
                aria-controls="search-drawer"
              >
                <img src="{{base}}images/used/icon_search_b.svg" alt="" />
              </button>
              <button
                class="icon-button cart-button"
                type="button"
                aria-label="장바구니, 0개"
              >
                <img src="{{base}}images/used/icon_header_cart_b_512.svg" alt="" />
                <span class="cart-count" aria-hidden="true" hidden>0</span>
              </button>
            </nav>
          </div>
          <div class="part-box header__mobile-categories">
            <nav
              class="part-box header__mobile-menu"
              id="mobile-categories"
              aria-label="카테고리"
            >
              <a href="{{home}}#best-products">APPAREL</a>
              <a href="{{home}}#best-products">굿즈</a>
              <span class="header__mobile-extra" hidden>커뮤니티</span>
            </nav>
            <button
              class="icon-button category-toggle"
              type="button"
              aria-label="카테고리 더 보기"
              aria-expanded="false"
              aria-controls="mobile-categories"
            >
              <span aria-hidden="true">+</span>
            </button>
          </div>
        </div>
      </div>
    </header>
