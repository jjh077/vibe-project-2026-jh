<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>장바구니 | 그루밍데이</title>
    <meta name="description" content="그루밍데이 장바구니" />
    <link rel="stylesheet" href="../css/variables.css" />
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/main.css" />
    <link rel="stylesheet" href="../css/auth.css" />
    <link rel="stylesheet" href="../css/shop.css" />
  </head>

  <body>

    <main class="shop-page">
      <nav class="shop-breadcrumb" aria-label="현재 위치">
        <a href="../index.html" aria-label="홈"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 12 4l9 7M5 10v10h5v-6h4v6h5V10"/></svg></a>
        <span aria-hidden="true">›</span>
        <span aria-current="page">장바구니</span>
      </nav>
      <h1 class="shop-title">장바구니</h1>

      <div class="cart-login">
        <strong>로그인 후 더 많은 혜택을 받으세요 ›</strong>
        <span>로그인을 하시면 장바구니에 담은 상품을 나중에도 확인하실 수 있습니다.</span>
      </div>

      <div class="cart-layout">
        <section aria-label="장바구니 상품 목록">
          <div class="cart-toolbar">
            <label>
              <input class="cart-check" type="checkbox" id="cart-check-all" />
              전체선택
            </label>
            <button type="button" id="cart-delete-selected">선택삭제</button>
          </div>
          <ul class="cart-list" id="cart-list" aria-live="polite"></ul>
          <p class="cart-sumbar" id="cart-sum-bar"></p>
          <div class="cart-links">
            <a href="#" data-soon>해외장바구니로 이동</a>
            <a href="#" data-soon>견적서 출력</a>
            <a href="#" id="cart-continue">쇼핑 계속하기</a>
          </div>
        </section>

        <aside class="cart-summary" aria-label="주문 금액">
          <h2 class="cart-summary__head">주문상품</h2>
          <dl class="cart-summary__rows">
            <div class="cart-summary__row"><dt>총 상품금액</dt><dd id="sum-product">0원</dd></div>
            <div class="cart-summary__row"><dt>총 배송비</dt><dd id="sum-shipping">0원</dd></div>
            <div class="cart-summary__row cart-summary__row--total"><dt>결제예정금액</dt><dd id="sum-pay">0원</dd></div>
          </dl>
          <div class="cart-summary__order">
            <span class="cart-summary__count" id="sum-count">총 0개</span>
            <button class="cart-summary__btn" type="button" id="cart-order">0원 주문하기</button>
          </div>
        </aside>
      </div>
      <p class="cart-note"><span id="cart-free-note"></span> · 할인 적용 금액은 주문서작성의 결제예정금액에서 확인 가능합니다.</p>
      <div class="cart-toast" id="cart-toast" role="status" hidden></div>
    </main>
    <script type="module" src="../js/footer.js"></script>
    <script type="module" src="../js/main.js"></script>
    <script type="module" src="../js/auth/auth-ui.js"></script>
    <script type="module" src="../js/cart-page.js"></script>
  </body>
</html>
